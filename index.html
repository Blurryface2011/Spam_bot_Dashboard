<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 230px;
            height: 100vh;
            background: #1f2937;
            padding: 25px 15px;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .menu {
            padding: 13px;
            margin: 6px 0;
            border-radius: 8px;
            color: #d1d5db;
        }

        .menu:hover,
        .active {
            background: #374151;
            color: white;
        }

        .content {
            margin-left: 230px;
            padding: 35px;
        }

        .login {
            display: inline-block;
            margin-top: 20px;
            background: #5865f2;
            color: white;
            text-decoration: none;
            padding: 13px 22px;
            border-radius: 8px;
            font-weight: bold;
        }

        .login:hover {
            background: #4752c4;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: #1f2937;
            border-radius: 14px;
            padding: 22px;
        }

        .title {
            color: #9ca3af;
            font-size: 14px;
        }

        .value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 10px;
        }

        .online {
            color: #22c55e;
        }

        #user {
            margin-top: 20px;
            color: #9ca3af;
        }

        @media (max-width: 700px) {
            .sidebar {
                width: 70px;
            }

            .logo {
                font-size: 0;
            }

            .logo::after {
                content: "🤖";
                font-size: 25px;
            }

            .menu {
                text-align: center;
                font-size: 0;
            }

            .content {
                margin-left: 70px;
                padding: 20px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <div class="logo">Discord Dashboard</div>

        <div class="menu active">🏠 Accueil</div>
        <div class="menu">🖥️ Serveurs</div>
        <div class="menu">💬 Messages</div>
        <div class="menu">⚙️ Configuration</div>
        <div class="menu">👥 Utilisateurs</div>
    </aside>

    <main class="content">

        <h1>Bienvenue 👋</h1>

        <p>Voici le panneau de contrôle de ton bot Discord.</p>

        <a
            class="login"
            href="https://spam-bot-dashboard.onrender.com/login"
        >
            🔵 Se connecter avec Discord
        </a>

        <div id="user"></div>

        <section class="cards">

            <div class="card">
                <div class="title">État du bot</div>
                <div class="value online">● En ligne</div>
            </div>

            <div class="card">
                <div class="title">Serveurs</div>
                <div class="value" id="serverCount">—</div>
            </div>

            <div class="card">
                <div class="title">Compte</div>
                <div class="value" id="accountStatus">Déconnecté</div>
            </div>

        </section>

    </main>

    <script>
        async function loadUser() {
            try {
                const response = await fetch(
                    "https://spam-bot-dashboard.onrender.com/api/user",
                    {
                        credentials: "include"
                    }
                );

                const data = await response.json();

                if (data.logged_in) {
                    document.getElementById("accountStatus").textContent =
                        data.username;

                    document.getElementById("user").textContent =
                        "Connecté en tant que " +
                        (data.global_name || data.username);

                    loadGuilds();
                }
            } catch (error) {
                console.error(error);
            }
        }

        async function loadGuilds() {
            try {
                const response = await fetch(
                    "https://spam-bot-dashboard.onrender.com/api/guilds",
                    {
                        credentials: "include"
                    }
                );

                const guilds = await response.json();

                if (Array.isArray(guilds)) {
                    document.getElementById("serverCount").textContent =
                        guilds.length;
                }
            } catch (error) {
                console.error(error);
            }
        }

        loadUser();
    </script>

</body>
</html>
