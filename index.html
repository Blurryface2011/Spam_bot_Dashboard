<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 230px;
            height: 100vh;
            background: #1f2937;
            padding: 25px 15px;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .menu {
            padding: 13px;
            margin: 6px 0;
            border-radius: 8px;
            color: #d1d5db;
            cursor: pointer;
        }

        .active,
        .menu:hover {
            background: #374151;
            color: white;
        }

        .content {
            margin-left: 230px;
            padding: 35px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: #1f2937;
            border-radius: 14px;
            padding: 22px;
        }

        .title {
            color: #9ca3af;
            font-size: 14px;
        }

        .value {
            font-size: 25px;
            font-weight: bold;
            margin-top: 10px;
        }

        .online {
            color: #22c55e;
        }

        .servers {
            margin-top: 30px;
        }

        .server {
            background: #1f2937;
            padding: 18px;
            margin-top: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.15s;
        }

        .server:hover {
            background: #374151;
        }

        .server-name {
            font-size: 17px;
            font-weight: bold;
        }

        .server-id {
            color: #9ca3af;
            font-size: 12px;
            margin-top: 5px;
        }

        .login {
            display: inline-block;
            margin-top: 20px;
            background: #5865f2;
            color: white;
            text-decoration: none;
            padding: 13px 22px;
            border-radius: 8px;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 700px) {

            .sidebar {
                width: 70px;
            }

            .logo {
                font-size: 0;
            }

            .logo::after {
                content: "🤖";
                font-size: 25px;
            }

            .menu {
                text-align: center;
                font-size: 0;
            }

            .content {
                margin-left: 70px;
                padding: 20px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<aside class="sidebar">

    <div class="logo">
        Discord Dashboard
    </div>

    <div class="menu active">
        🏠 Accueil
    </div>

    <div class="menu">
        🖥️ Serveurs
    </div>

    <div class="menu">
        💬 Messages
    </div>

    <div class="menu">
        ⚙️ Configuration
    </div>

    <div class="menu">
        👥 Utilisateurs
    </div>

</aside>


<main class="content">

    <div id="loginArea">

        <h1>Discord Bot Dashboard</h1>

        <p>
            Connecte ton compte Discord pour continuer.
        </p>

        <a
            class="login"
            href="https://spam-bot-dashboard.onrender.com/login"
        >
            🔵 Se connecter avec Discord
        </a>

    </div>


    <div id="dashboard" class="hidden">

        <h1 id="username"></h1>

        <section class="cards">

            <div class="card">
                <div class="title">
                    État du bot
                </div>

                <div class="value online">
                    ● En ligne
                </div>
            </div>


            <div class="card">
                <div class="title">
                    Serveurs avec le bot
                </div>

                <div
                    class="value"
                    id="serverCount"
                >
                    0
                </div>
            </div>


            <div class="card">
                <div class="title">
                    Compte Discord
                </div>

                <div class="value">
                    Connecté
                </div>
            </div>

        </section>


        <section class="servers">

            <h2>
                🖥️ Mes serveurs
            </h2>

            <div id="serverList"></div>

        </section>

    </div>

</main>


<script>

async function loginWithCode() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const code =
        params.get("code");

    if (!code) {
        return false;
    }

    const response =
        await fetch(
            "https://spam-bot-dashboard.onrender.com/api/exchange",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    code: code
                })
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        console.error(data);

        return false;
    }

    localStorage.setItem(
        "discord_dashboard",
        JSON.stringify(data)
    );

    window.history.replaceState(
        {},
        document.title,
        window.location.pathname
    );

    return true;
}


function displayDashboard(data) {

    document.getElementById(
        "loginArea"
    ).classList.add("hidden");

    document.getElementById(
        "dashboard"
    ).classList.remove("hidden");


    document.getElementById(
        "username"
    ).textContent =
        "👤 " +
        (
            data.user.global_name ||
            data.user.username
        );


    /*
        Pour l'instant Discord nous donne
        tous les serveurs de l'utilisateur.

        On garde seulement les serveurs
        où l'utilisateur possède les droits
        d'administration.
    */

    const servers =
        data.guilds.filter(server => {

            const permissions =
                BigInt(server.permissions || "0");

            const ADMINISTRATOR =
                BigInt(8);

            return (
                (permissions & ADMINISTRATOR)
                === ADMINISTRATOR
            );

        });


    document.getElementById(
        "serverCount"
    ).textContent =
        servers.length;


    const list =
        document.getElementById(
            "serverList"
        );

    list.innerHTML = "";


    if (servers.length === 0) {

        list.innerHTML =
            "<p>Aucun serveur administrable trouvé.</p>";

        return;
    }


    servers.forEach(server => {

        const div =
            document.createElement("div");

        div.className =
            "server";


        const name =
            document.createElement("div");

        name.className =
            "server-name";

        name.textContent =
            "🖥️ " + server.name;


        const id =
            document.createElement("div");

        id.className =
            "server-id";

        id.textContent =
            "ID : " + server.id;


        div.appendChild(name);
        div.appendChild(id);

        list.appendChild(div);

    });

}


async function start() {

    try {

        const loggedIn =
            await loginWithCode();


        if (loggedIn) {

            const data =
                JSON.parse(
                    localStorage.getItem(
                        "discord_dashboard"
                    )
                );

            displayDashboard(data);

            return;
        }


        const saved =
            localStorage.getItem(
                "discord_dashboard"
            );


        if (saved) {

            displayDashboard(
                JSON.parse(saved)
            );

        }

    } catch (error) {

        console.error(error);

    }

}


start();

</script>

</body>
</html>
